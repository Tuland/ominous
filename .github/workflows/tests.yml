# The checks that need no Omarchy shell: unit tests (node --test), the shipped themes against
# tools/draw-themes.py, and tools/lint.sh (shellcheck, tsc, mypy; qmllint only where the shell
# is installed). The live checks need a running shell and stay local (tests/run.sh without
# --unit). Actions are pinned to full commits; tool versions come from mise.toml.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tools at the versions in mise.toml, the same as on a developer's machine.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Unit tests, theme art check and lint
        run: tests/run.sh --unit

# The checks that need no Omarchy shell: unit tests (node --test) and the shipped themes
# against tools/draw-themes.py. The live checks need a running shell and stay local
# (tests/run.sh without --unit). Actions are pinned to full commits.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Unit tests and theme art check
        run: tests/run.sh --unit

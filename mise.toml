# The development tools and their versions, the same on every machine and on the CI
# (.github/workflows/tests.yml installs them with mise-action). Change a version here only.
[tools]
node = "24"
shellcheck = "0.11.0"
"npm:typescript" = "7.0.2"
uv = "0.12.23"
# Installed with the uv above (`uv tool install`), not pipx.
"pipx:mypy" = { version = "2.4.0", uvx = true }

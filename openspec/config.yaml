schema: spec-driven

context: |
  Ominous: an Omarchy (Hyprland + Quickshell) shell plugin, id io.github.tuland.ominous
  (permanent). Service.qml polls `omacal agenda --json` (OmaCal's offline DB) and summons
  Alert.qml, an overlay card centred on the focused monitor, before a meeting starts; three
  phases (relaxed, tense, angry), a professional and a playful mode, JSON themes.
  Every decision is a pure function in Logic.js (.pragma library), unit tested under node;
  the QML files and components/ are glue. Config keys, IPC commands and theme format are
  documented in docs/; CLAUDE.md has the layout, the rules and the checks
  (`tests/run.sh`: unit, art, lint, live). Code style: doc comments everywhere
  (docs/development.md, "Code style").
  Behavior, config, commands and packaging changes get spec deltas; tooling, tests, CI and
  agent skills set skip_specs: true. User-visible changes go under Unreleased in CHANGELOG.md.
  Everything in English. No personal or employer data in code, docs, tests or examples.

rules:
  tasks:
    - >-
      The last group of every change is "Review", the last task of the change: a code review
      and a security review of the change's own diff, read against its proposal, specs and
      design and against the "Security" section of docs/development.md (untrusted input,
      sinks, APIs not allowed). Fix what they find inside the change; a finding that needs
      a decision goes to the user. The change is done only when the Review group is ticked,
      and it is committed after it.


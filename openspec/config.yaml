schema: spec-driven

context: |
  Ominous: an Omarchy (Hyprland + Quickshell) shell plugin, id io.github.tuland.ominous.
  Service.qml polls `omacal agenda --json` (OmaCal's offline DB) and summons Alert.qml,
  an overlay card centred on the focused monitor, before a meeting starts.
  Pure logic lives in Logic.js (.pragma library), checked by `node tests/logic.test.mjs`.
  Config: ~/.config/omarchy/ominous.json (calendars, leadSeconds, dim).
  Everything in English. No personal or employer data in code, docs, tests or examples.

